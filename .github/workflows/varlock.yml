name: Validate environment schema

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Non-secret fixtures exercise required-item and format validation on
      # untrusted pull requests without granting access to deployment secrets.
      APP_ENV: test
      BETTER_AUTH_SECRET: ci-only-schema-validation-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate environment schema
        uses: dmno-dev/varlock-action@v1.0.1
        with:
          fail-on-error: true
          show-summary: true
