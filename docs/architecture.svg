<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Durable Notes architecture</title>
  <desc id="desc">A browser reaches a public gateway, which routes to private authentication, user data, synchronization, administration, and Flue agent workers. Each user has SQLite-backed Durable Objects for application data, the canonical event log, and agent conversation state. A queue projects per-user events into D1 for cross-user queries.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; fill: #64748b; }
      .name { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .detail { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .edge-label { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .worker { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .durable { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; }
      .shared { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .group { fill: #fffbeb; stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .both { fill: none; stroke: #475569; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .soft { fill: none; stroke: #94a3b8; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#ffffff" />
  <text class="title" x="48" y="54">Requests reach the edge; user data and agent state stay close together</text>
  <text class="subtitle" x="48" y="82">The gateway is the only public Worker. Everything behind it uses private bindings.</text>

  <text class="lane" x="48" y="128">CLIENT</text>
  <text class="lane" x="292" y="128">PUBLIC EDGE</text>
  <text class="lane" x="500" y="128">PRIVATE WORKERS</text>
  <text class="lane" x="770" y="128">PER-USER EDGE STATE</text>
  <text class="lane" x="1170" y="128">SHARED SERVICES</text>

  <rect class="group" x="748" y="144" width="380" height="596" rx="20" />
  <text class="edge-label" x="772" y="172">ADDRESSABLE BY AUTHENTICATED USER / CONVERSATION ID</text>

  <rect class="box" x="48" y="342" width="202" height="108" rx="14" />
  <text class="name" x="149" y="380" text-anchor="middle">Browser</text>
  <text class="detail" x="149" y="405" text-anchor="middle">React + LiveStore</text>
  <text class="detail" x="149" y="426" text-anchor="middle">local OPFS SQLite</text>

  <rect class="worker" x="292" y="342" width="170" height="108" rx="14" />
  <text class="name" x="377" y="386" text-anchor="middle">Gateway Worker</text>
  <text class="detail" x="377" y="411" text-anchor="middle">public entry</text>

  <rect class="worker" x="500" y="168" width="204" height="78" rx="12" />
  <text class="name" x="602" y="200" text-anchor="middle">Auth Worker</text>
  <text class="detail" x="602" y="222" text-anchor="middle">Better Auth</text>

  <rect class="worker" x="500" y="278" width="204" height="78" rx="12" />
  <text class="name" x="602" y="310" text-anchor="middle">Flue Agent Worker</text>
  <text class="detail" x="602" y="332" text-anchor="middle">generated deployment target</text>

  <rect class="worker" x="500" y="388" width="204" height="78" rx="12" />
  <text class="name" x="602" y="420" text-anchor="middle">User Worker</text>
  <text class="detail" x="602" y="442" text-anchor="middle">typed application RPC</text>

  <rect class="worker" x="500" y="498" width="204" height="78" rx="12" />
  <text class="name" x="602" y="530" text-anchor="middle">LiveStore Worker</text>
  <text class="detail" x="602" y="552" text-anchor="middle">event synchronization</text>

  <rect class="worker" x="500" y="608" width="204" height="78" rx="12" />
  <text class="name" x="602" y="640" text-anchor="middle">Admin Worker</text>
  <text class="detail" x="602" y="662" text-anchor="middle">cross-user queries</text>

  <rect class="durable" x="786" y="220" width="304" height="96" rx="14" />
  <text class="name" x="938" y="256" text-anchor="middle">Flue Conversation DO</text>
  <text class="detail" x="938" y="280" text-anchor="middle">conversation state + stream</text>
  <text class="detail" x="938" y="300" text-anchor="middle">SQLite + Workers AI</text>

  <rect class="durable" x="786" y="386" width="304" height="96" rx="14" />
  <text class="name" x="938" y="422" text-anchor="middle">UserDO</text>
  <text class="detail" x="938" y="446" text-anchor="middle">per-user server view</text>
  <text class="detail" x="938" y="466" text-anchor="middle">SQLite-backed Durable Object</text>

  <rect class="durable" x="786" y="552" width="304" height="96" rx="14" />
  <text class="name" x="938" y="588" text-anchor="middle">UserSyncBackendDO</text>
  <text class="detail" x="938" y="612" text-anchor="middle">canonical per-user event log</text>
  <text class="detail" x="938" y="632" text-anchor="middle">SQLite-backed Durable Object</text>

  <rect class="shared" x="1170" y="168" width="220" height="78" rx="12" />
  <text class="name" x="1280" y="200" text-anchor="middle">Auth D1</text>
  <text class="detail" x="1280" y="222" text-anchor="middle">accounts + sessions</text>

  <rect class="shared" x="1170" y="522" width="220" height="70" rx="12" />
  <text class="name" x="1280" y="552" text-anchor="middle">Projection Queue</text>
  <text class="detail" x="1280" y="574" text-anchor="middle">validated per-user events</text>

  <rect class="shared" x="1170" y="616" width="220" height="78" rx="12" />
  <text class="name" x="1280" y="648" text-anchor="middle">Projection D1</text>
  <text class="detail" x="1280" y="670" text-anchor="middle">cross-user read model</text>

  <path class="both" d="M 250 396 L 292 396" />
  <text class="edge-label" x="271" y="382" text-anchor="middle">HTTP / WS</text>

  <path class="soft" d="M 462 374 C 480 374, 480 207, 500 207" />
  <path class="soft" d="M 462 386 C 478 386, 478 317, 500 317" />
  <path class="soft" d="M 462 402 L 500 427" />
  <path class="soft" d="M 462 414 C 478 414, 478 537, 500 537" />
  <path class="soft" d="M 462 426 C 480 426, 480 647, 500 647" />

  <path class="line" d="M 704 207 L 1170 207" />
  <path class="line" d="M 704 317 L 786 268" />
  <path class="line" d="M 704 427 L 786 434" />
  <path class="both" d="M 704 537 L 786 600" />

  <path class="line" d="M 938 316 L 938 386" />
  <text class="edge-label" x="952" y="354">repeated tool calls</text>

  <path class="both" d="M 938 482 L 938 552" />
  <text class="edge-label" x="952" y="521">event sync</text>

  <path class="line" d="M 1090 600 C 1128 600, 1132 557, 1170 557" />
  <path class="line" d="M 1280 592 L 1280 616" />
  <path class="line" d="M 704 647 L 1170 655" />

  <line x1="48" y1="770" x2="1390" y2="770" stroke="#e2e8f0" />
  <text class="detail" x="48" y="798">Alchemy declares and deploys the Workers, Durable Objects, D1 databases, queues, bindings, and static application from one TypeScript graph.</text>
</svg>
